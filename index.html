<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Popz: Sugar Rush Edition</title>
    <style>
        :root { 
            --candy-pink: #ff69b4; 
            --sugar-white: #fff5f8;
            --mint-green: #00ffcc;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
            color: #4a0026;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none;
        }

        canvas {
            background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
            border: 8px solid white;
            border-radius: 30px;
            cursor: crosshair;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        #game-ui {
            position: absolute;
            top: 20px;
            width: 760px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid var(--candy-pink);
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 20px;
            box-shadow: 0 4px 0 var(--candy-pink);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #prize-modal, #miss-modal {
            position: absolute;
            display: none;
            background: white;
            border: 10px solid var(--candy-pink);
            padding: 40px;
            text-align: center;
            z-index: 100;
            border-radius: 40px;
            box-shadow: 0 20px 0 #d63384;
        }

        #miss-modal { border-color: #5d4037; box-shadow: 0 20px 0 #3e2723; }
        .code { font-size: 40px; color: var(--candy-pink); margin: 20px 0; font-weight: bold; }

        button {
            background: var(--candy-pink);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d63384;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="stat-box">🍬 SCORE: <span id="score">0</span></div>
    <div class="stat-box">🥣 BOWL: <span id="bowl-count">0</span></div>
    <div class="stat-box">TARGET: 1000</div>
</div>

<div id="prize-modal">
    <h1>👑 CANDY KING!</h1>
    <p>You dominated the Sugar Rush!</p>
    <div class="code">SUGARPOPZ10</div>
    <button onclick="location.reload()">RE-RACE</button>
</div>

<div id="miss-modal">
    <h2>🍄 GLITCHED OUT</h2>
    <p id="fail-msg">You missed a sweet!</p>
    <button onclick="location.reload()">RETRY</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

let score = 0;
let gameActive = true;
let bowl = { x: 350, y: 520, w: 140, h: 70 };
let candies = [];
let collectedCandy = []; 
let particles = [];
let floatingTexts = [];

let spawnRate = 700;
let difficultyTimer = 0;

const candyTypes = ['🍬', '🍭', '🧁', '🍩', '🍫', '🍦'];
const rottenTypes = ['☠️', '🧪', '💀', '🍄'];
const trashTalk = [
    "EYES OPEN, SUGAR-BRAIN!",
    "THAT'S LITERALLY POISON!",
    "MOLDY MANIA!",
    "ENJOY THE DENTIST BILL!",
    "STAY IN YOUR LANE!",
    "TOTAL ROOKIE MOVE!"
];

// Background Sprinkles
for(let i=0; i<50; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 2,
        speed: Math.random() * 2 + 1,
        color: ['#fff', '#ff99cc', '#00ffcc'][Math.floor(Math.random() * 3)]
    });
}

function spawnCandy() {
    if (!gameActive) return;

    let difficultyFactor = Math.min(0.35, difficultyTimer / 20000);
    let isRotten = Math.random() < (0.15 + difficultyFactor);

    candies.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -50,
        type: isRotten ? 'rotten' : 'good',
        icon: isRotten 
            ? rottenTypes[Math.floor(Math.random() * rottenTypes.length)]
            : candyTypes[Math.floor(Math.random() * candyTypes.length)],
        speed: 3 + Math.random() * 3 + difficultyFactor * 3,
        size: isRotten ? 45 : 30 + Math.random() * 10
    });

    setTimeout(spawnCandy, spawnRate);
}

function addFloatingText(text, x, y, color = "#ff69b4") {
    floatingTexts.push({
        text: text,
        x: x,
        y: y,
        opacity: 1,
        color: color
    });
}

function drawBowl(x, y, w, h) {
    ctx.save();
    // Dish shadow
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0,0,0,0.1)';
    
    // Dish Body
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + w/2, y + h, x + w, y);
    ctx.lineTo(x + w - 15, y - 10);
    ctx.lineTo(x + 15, y - 10);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#ff69b4';
    ctx.lineWidth = 6;
    ctx.stroke();

    // DRAW CANDY PILE INSIDE BOWL
    collectedCandy.forEach((c, i) => {
        ctx.font = "24px Arial";
        // Grid layout inside bowl
        let cols = 5;
        let offsetX = (i % cols) * 22;
        let offsetY = Math.floor(i / cols) * 20;
        ctx.fillText(c, x + 25 + offsetX, y - 5 - offsetY);
    });
    ctx.restore();
}

function draw() {
    if (!gameActive) return;

    difficultyTimer += 16;
    ctx.fillStyle = '#ffe6f2';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sprinkles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speed;
        if(p.y > canvas.height) p.y = -10;
    });

    drawBowl(bowl.x, bowl.y, bowl.w, bowl.h);

    // Candies
    candies.forEach((c, i) => {
        c.y += c.speed;
        ctx.font = `${c.size}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(c.icon, c.x, c.y);

        // Catching mechanics
        if (c.y > bowl.y - 20 && c.y < bowl.y + bowl.h &&
            c.x > bowl.x && c.x < bowl.x + bowl.w) {
            
            if (c.type === 'rotten') {
                // TRASH TALK & PUNISHMENT
                let insult = trashTalk[Math.floor(Math.random() * trashTalk.length)];
                addFloatingText(insult, bowl.x + bowl.w/2, bowl.y - 50, "#8b0000");
                
                // Bowl explodes visually
                collectedCandy = []; 
                score = Math.max(0, score - 150);
                
                canvas.style.backgroundColor = "rgba(255,0,0,0.2)";
                setTimeout(() => canvas.style.backgroundColor = "", 150);
            } else {
                // SUCCESS
                score += 20;
                collectedCandy.push(c.icon);
                addFloatingText("+20", c.x, c.y - 20);
                
                if (collectedCandy.length > 25) collectedCandy.shift();
            }
            candies.splice(i, 1);
        }

        // Missed candy
        if (c.y > canvas.height) {
            if (c.type === 'good') {
                document.getElementById('fail-msg').innerText = "A sweet hit the floor! Amateur!";
                endGame('miss-modal');
            }
            candies.splice(i, 1);
        }
    });

    // Animate Floating Text
    floatingTexts.forEach((ft, i) => {
        ctx.save();
        ctx.globalAlpha = ft.opacity;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 24px Arial";
        ctx.fillText(ft.text, ft.x, ft.y);
        ft.y -= 2;
        ft.opacity -= 0.02;
        if(ft.opacity <= 0) floatingTexts.splice(i, 1);
        ctx.restore();
    });

    // Updates
    if (difficultyTimer % 3000 < 16 && spawnRate > 300) spawnRate -= 25;
    document.getElementById('score').innerText = score;
    document.getElementById('bowl-count').innerText = collectedCandy.length;

    if (score >= 1000) endGame('prize-modal');
    requestAnimationFrame(draw);
}

function endGame(modalId) {
    gameActive = false;
    document.getElementById(modalId).style.display = 'block';
}

function moveBowl(clientX) {
    let rect = canvas.getBoundingClientRect();
    bowl.x = (clientX - rect.left) - bowl.w / 2;
    bowl.x = Math.max(0, Math.min(canvas.width - bowl.w, bowl.x));
}

canvas.addEventListener('mousemove', e => moveBowl(e.clientX));
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    moveBowl(e.touches[0].clientX);
}, {passive: false});

spawnCandy();
draw();
</script>
</body>
</html>
