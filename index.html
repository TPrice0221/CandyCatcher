<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sugar Popz: Powered By Producers</title>
    <style>
        :root {  
            --candy-pink: #ff69b4; 
            --mint: #00ffcc;
            --bad-red: #ff3333;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-ui {
            width: 900px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            pointer-events: none;
            z-index: 50;
        }

        .stat-box {
            background: white;
            border: 4px solid var(--candy-pink);
            padding: 5px 15px;
            border-radius: 50px;
            color: #d63384;
            font-weight: bold;
            font-size: clamp(12px, 3.5vw, 18px);
            box-shadow: 0 4px 0 var(--candy-pink);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #lives-display {
            color: var(--candy-pink);
            font-size: 20px;
            letter-spacing: 2px;
        }

        #canvas-wrapper {
            position: relative;
            width: 900px;
            height: 700px;
            max-width: 95vw;
            max-height: 70vh;
            background: #000;
            border: 8px solid white;
            border-radius: 30px;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none;
        }

        #feedback-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 105, 180, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: white;
            border: 8px solid var(--candy-pink);
            color: #d63384;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            width: 80%;
        }

        h1 { font-size: clamp(30px, 8vw, 60px); text-shadow: 4px 4px #d63384; margin: 0; color: white; }
        
        button {
            background: var(--mint);
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: bold;
            box-shadow: 0 5px 0 #00ccaa;
            cursor: pointer;
            color: #4a0026;
            margin-top: 15px;
        }

        .feedback-text {
            position: absolute;
            font-weight: 900;
            font-size: 28px;
            pointer-events: none;
            text-align: center;
            width: 250px;
            animation: floatUp 0.8s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" src="beat1.mp3" preload="auto" loop></audio>
<div id="game-ui">
    <div class="stat-box">⭐ <span id="score">0</span></div>
    <div class="stat-box">LVL <span id="level">1</span></div>
    <div class="stat-box" id="lives-display">💗💗💗</div>
    <div class="stat-box">🥣 <span id="candyCount">0</span>/<span id="targetDisplay">20</span></div>
</div>

<div id="canvas-wrapper">
    <div id="screen-overlay" class="overlay">
        <div class="modal-box" id="modal-content">
            <h1>Sugar Popz 🍬</h1>
            <p>Catch 🍬 Fill the bowl to advance! <br>Careful! ☠️ Rotten Candy resets your progress! </p>
            <button onclick="bootGame()">START GAME</button>
        </div>
    </div>
    <div id="feedback-layer"></div>
    <canvas id="game"></canvas>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const feedbackLayer = document.getElementById("feedback-layer");
    const overlay = document.getElementById("screen-overlay");
    const modalContent = document.getElementById("modal-content");
    const livesDisplay = document.getElementById("lives-display");
    const music = document.getElementById("bgMusic");

    const GAME_W = 900;
    const GAME_H = 700;
    canvas.width = GAME_W;
    canvas.height = GAME_H;

    let gameActive = false;
    let score = 0, level = 1, lives = 3;
    let bowl = { x: 370, y: 600, w: 160, h: 65 };
    let candies = [];
    let collected = [];
    let particles = [];
    let spawnTimer;

    const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
    const badTypes = ['☠️','💀','🧪', '🍄', '💩'];
    const sweetPhrases = ["SWEET!", "Sugar Rush!", "Nom Nom!", "Delicious!"];
    const rottenMessages = {'🧪': "POISONED!", '☠️': "STOLEN!", '💀': "CURSED!", '🍄': "TRAPPED!", '💩': "YUCK!"};

    // Particles
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * GAME_W,
            y: Math.random() * GAME_H,
            size: Math.random() * 4 + 1,
            speed: Math.random() * 1 + 0.5,
            color: ['#fff', '#ff99cc', '#00ffcc', '#ffff99'][Math.floor(Math.random()*4)]
        });
    }

    function getCurrentTarget() { return 20 + ((level - 1) * 5); }
    
    function updateLivesDisplay() { 
        livesDisplay.innerText = lives > 0 ? "💗".repeat(lives) : "💔"; 
    }

    function bootGame() {
        if(music) music.play().catch(()=>{});
        overlay.style.display = "none";
        gameActive = true;
        score = 0;
        level = 1;
        lives = 3;
        candies = [];
        collected = [];
        updateLivesDisplay();
        clearTimeout(spawnTimer);
        spawn();
        requestAnimationFrame(loop);
    }

    function handleMove(e) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_W / rect.width;
        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const mouseX = (clientX - rect.left) * scaleX;
        bowl.x = mouseX - (bowl.w / 2);
        if (bowl.x < 0) bowl.x = 0;
        if (bowl.x > GAME_W - bowl.w) bowl.x = GAME_W - bowl.w;
    }

    canvas.addEventListener("mousemove", handleMove);
    canvas.addEventListener("touchmove", (e) => { handleMove(e); e.preventDefault(); }, { passive: false });

    function spawn() {
        if (!gameActive) return;

        if (lives < 3 && Math.random() < 0.10) {
            let startX = Math.random() * (GAME_W - 200) + 50;
            candies.push({ x: startX, y: -50, icon: '💗', type: 'life', speed: 4 + level });
        } else {
            let isBad = Math.random() < (0.12 + level * 0.02);
            candies.push({
                x: Math.random() * (GAME_W - 100) + 50,
                y: -50,
                icon: isBad ? badTypes[Math.floor(Math.random()*badTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
                type: isBad ? "bad" : "good",
                speed: 3 + level + (Math.random() * 2)
            });
        }
        
        let delay = Math.max(300, 800 - (level * 50)); 
        spawnTimer = setTimeout(spawn, delay);
    }

    function pop(text, x, y, type) {
        const el = document.createElement('div');
        el.className = `feedback-text`;
        el.style.color = type === 'good' ? 'var(--mint)' : (type === 'life' ? 'white' : 'var(--bad-red)');
        el.style.left = (x - 125) + 'px';
        el.style.top = (y - 50) + 'px';
        el.innerText = text;
        feedbackLayer.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function loop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, GAME_W, GAME_H);

        // BG
        particles.forEach(p => {
            ctx.fillStyle = p.color + '88';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            p.y += p.speed; if (p.y > GAME_H) p.y = 0;
        });

        // Bowl
        ctx.fillStyle = "white"; ctx.strokeStyle = "var(--candy-pink)"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 30, 30]); ctx.fill(); ctx.stroke();
        
        // Collected candy visual
        collected.slice(-15).forEach((c, i) => {
            ctx.font = "20px Arial";
            ctx.fillText(c, bowl.x + 20 + (i % 5 * 30), bowl.y + 25 + (Math.floor(i/5) * 15));
        });

        let currentTarget = getCurrentTarget();

        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            ctx.font = "48px Arial"; ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            // Collision
            if (c.y + 20 > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    pop(rottenMessages[c.icon] || "YUCK!", c.x, c.y, 'bad');
                    collected = [];
                } else if (c.type === "life") {
                    if (lives < 3) lives++;
                    updateLivesDisplay();
                    pop("+1 LIFE!", c.x, c.y, 'life');
                } else {
                    collected.push(c.icon);
                    score += 25;
                    pop(sweetPhrases[Math.floor(Math.random()*sweetPhrases.length)], c.x, bowl.y, 'good');
                    
                    if (collected.length >= currentTarget) {
                        // Immediately update count before pausing
                        document.getElementById("candyCount").innerText = collected.length;
                        setTimeout(levelUp, 100); 
                    }
                }
                candies.splice(i, 1);
            } else if (c.y > GAME_H + 50) {
                if (c.type === "good") {
                    lives--;
                    updateLivesDisplay();
                    pop("MISS!", c.x, GAME_H - 100, 'bad');
                    if (lives <= 0) gameOver();
                }
                candies.splice(i, 1);
            }
        }

        document.getElementById("score").innerText = score;
        document.getElementById("level").innerText = level;
        document.getElementById("candyCount").innerText = collected.length;
        document.getElementById("targetDisplay").innerText = currentTarget;

        requestAnimationFrame(loop);
    }

    function levelUp() {
        gameActive = false;
        clearTimeout(spawnTimer);
        level++;
        collected = [];
        candies = [];

        modalContent.innerHTML = `
            <h1>LEVEL UP!</h1>
            <p>Bowl filled!<br>Level ${level} is faster!</p>
            <button onclick="resume()">CONTINUE</button>
        `;
        overlay.style.display = "flex";
    }

    function resume() { 
        overlay.style.display = "none"; 
        gameActive = true; 
        spawn(); 
        requestAnimationFrame(loop); 
    }

    function gameOver() {
        gameActive = false;
        clearTimeout(spawnTimer);
        if(music) music.pause();
        modalContent.innerHTML = `<h1>GAME OVER</h1><p>Final Score: ${score}</p><button onclick="location.reload()">TRY AGAIN</button>`;
        overlay.style.display = "flex";
    }
</script>
</body>
</html>
