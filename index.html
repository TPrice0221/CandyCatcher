<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
    --sugar-white: #fff5f8;
    --mint: #00ffcc;
    --bad-red: #ff3333;
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game-container {
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* STABILITY FIX: Fixed container prevents layout shifting */
#canvas-wrapper {
    position: relative;
    width: 900px;
    height: 700px;
    background: #000;
    border: 10px solid white;
    border-radius: 40px;
    overflow: hidden; /* Clips any pop-ups that float outside the 900x700 area */
}

canvas {
    display: block;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    cursor: crosshair;
}

/* Layer specifically for the glowing text pop-ups */
#feedback-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Allows mouse through to the canvas */
    z-index: 10;
}

#game-ui {
    position: absolute;
    top: -60px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.stat-box {
    background: white;
    border: 4px solid var(--candy-pink);
    padding: 8px 25px;
    border-radius: 50px;
    color: #d63384;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 4px 0 var(--candy-pink);
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,105,180,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 100;
    border-radius: 30px;
    text-align: center;
}

.modal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 40px;
    border-radius: 40px;
    border: 10px solid var(--candy-pink);
    text-align: center;
    z-index: 200;
    box-shadow: 0 20px 0 #d63384;
    min-width: 300px;
}

h1 { font-size: 60px; text-shadow: 4px 4px #d63384; margin: 0; }
h2 { color: #d63384; font-size: 32px; margin-top: 0; }

button {
    margin-top: 20px;
    padding: 20px 40px;
    border: none;
    background: var(--mint);
    color: #4a0026;
    font-size: 24px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #00ccaa;
}

button:active { transform: translateY(4px); box-shadow: 0 2px 0 #00ccaa; }

.feedback-text {
    position: absolute;
    font-weight: 900;
    font-size: 28px;
    text-align: center;
    width: 200px;
    white-space: pre-line;
}

.good-feedback {
    color: var(--mint);
    text-shadow: 0 0 12px rgba(0, 255, 204, 0.9), 2px 2px 0px #d63384;
    animation: floatUp 0.8s ease-out forwards;
}

.bad-feedback {
    color: var(--bad-red);
    text-shadow: 0 0 15px rgba(255, 51, 51, 1), 2px 2px 0px #fff;
    animation: shakeFloat 1s ease-out forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
}

@keyframes shakeFloat {
    0% { transform: translateX(0); opacity: 1; }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-5px); }
    100% { transform: translateY(-80px); opacity: 0; }
}
</style>
</head>

<body>

<div id="game-container">
    <div id="game-ui">
        <div class="stat-box">⭐ <span id="score">0</span></div>
        <div class="stat-box">LVL: <span id="level">1</span></div>
        <div class="stat-box">🥣 <span id="candyCount">0</span></div>
    </div>

    <div id="canvas-wrapper">
        <div id="start-screen" class="overlay">
            <h1>Sugar Popz' Candy Catcher 🍬</h1>
            <p style="font-size: 20px;">Fill the bowl to clear the level!</p>
            <button onclick="startGame()">START RACE</button>
        </div>

        <div id="game-over" class="modal">
            <h2>GLITCHED!</h2>
            <p>A sweet hit the floor...</p>
            <button onclick="location.reload()">RE-RACE</button>
        </div>

        <div id="level-up" class="modal">
            <h2>SWEET VICTORY!</h2>
            <p>Prepare for a bigger Rush!</p>
            <button onclick="nextLevel()">NEXT ROUND</button>
        </div>

        <div id="feedback-layer"></div>
        <canvas id="game"></canvas>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const feedbackLayer = document.getElementById("feedback-layer");

const GAME_W = 900;
const GAME_H = 700;
canvas.width = GAME_W;
canvas.height = GAME_H;

let gameActive = false;
let bowl = { x: 370, y: 620, w: 160, h: 65 };
let candies = [];
let collected = [];
let particles = [];
let score = 0;
let level = 1;
let targetScore = 500;

const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
const rottenTypes = ['☠️','💀','🧪', '🍄', '💩'];

const sweetPhrases = ["SWEET!", "Cavity incoming!", "Candy before bed?", "SUGAR RUSH!", "Dentist's nightmare!", "Nom nom!", "Sugar Overload!", "Pure Joy!"];
const rottenMessages = {
    '🧪': "POISONED!",
    '☠️': "STOLEN!",
    '💀': "CURSED!",
    '🍄': "TRAPPED!",
    '💩': "YUCK!"
};

let currentBeatIndex = 0;
const beats = ["beat1.mp3", "beat2.mp3", "beat3.mp3"];
const bpm = [140, 150, 160]; 
const audio = new Audio();
audio.loop = true;

let audioCtx;
function playTick(freq, dur) {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

function playBeat(index) {
    audio.src = beats[index % beats.length];
    audio.play().catch(e => {});
}

function showFeedback(text, x, y, type) {
    const el = document.createElement('div');
    el.className = `feedback-text ${type}-feedback`;
    el.innerText = text;
    el.style.left = (x - 100) + 'px';
    el.style.top = (y - 40) + 'px';
    feedbackLayer.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function spawnCandy() {
    if (!gameActive) return;
    let isRotten = Math.random() < (0.12 + level * 0.03);
    candies.push({
        x: Math.random() * (GAME_W - 100) + 50,
        y: -50,
        icon: isRotten ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isRotten ? "bad" : "good",
        speed: 2 + level + (Math.random() * 1.5),
        size: isRotten ? 55 : 40
    });
    setTimeout(spawnCandy, (60 / bpm[currentBeatIndex % 3]) * 1000);
}

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameActive = true;
    playBeat(0);
    spawnCandy();
    requestAnimationFrame(draw);
}

function nextLevel() {
    document.getElementById("level-up").style.display = "none";
    level++;
    targetScore += 500;
    candies = []; collected = [];
    gameActive = true;
    currentBeatIndex++;
    playBeat(currentBeatIndex);
    spawnCandy();
}

for (let i = 0; i < 50; i++) {
    particles.push({ x: Math.random() * GAME_W, y: Math.random() * GAME_H, size: Math.random() * 3 + 1, speed: Math.random() * 1 + 0.5 });
}

function draw() {
    ctx.clearRect(0, 0, GAME_W, GAME_H);
    particles.forEach(p => {
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        p.y += p.speed; if (p.y > GAME_H) p.y = 0;
    });

    if (gameActive) {
        ctx.save();
        ctx.fillStyle = "white"; ctx.strokeStyle = "var(--candy-pink)"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 30, 30]); ctx.fill(); ctx.stroke();
        collected.slice(-20).forEach((c, i) => {
            ctx.font = "20px Arial";
            ctx.fillText(c, bowl.x + 10 + (i % 5 * 28), bowl.y + 20 + (Math.floor(i/5) * 12));
        });
        ctx.restore();

        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i]; c.y += c.speed;
            ctx.font = c.size + "px Arial"; ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            if (c.y > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    showFeedback(rottenMessages[c.icon], c.x, c.y, 'bad');
                    collected = []; score = Math.max(0, score - 100);
                    playTick(60, 0.3);
                } else {
                    collected.push(c.icon); score += 25;
                    showFeedback(sweetPhrases[Math.floor(Math.random()*sweetPhrases.length)], c.x, bowl.y, 'good');
                    playTick(400, 0.1);
                }
                candies.splice(i, 1); continue;
            }
            if (c.y > GAME_H) {
                if (c.type === "good") {
                    gameActive = false; audio.pause();
                    document.getElementById("game-over").style.display = "block";
                }
                candies.splice(i, 1);
            }
        }
        if (score >= targetScore) {
            gameActive = false; document.getElementById("level-up").style.display = "block";
        }
    }
    document.getElementById("score").innerText = score;
    document.getElementById("candyCount").innerText = collected.length;
    document.getElementById("level").innerText = level;
    requestAnimationFrame(draw);
}

canvas.addEventListener("mousemove", e => {
    let rect = canvas.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (GAME_W / rect.width);
    bowl.x = Math.max(0, Math.min(GAME_W - bowl.w, x - bowl.w/2));
});
</script>
</body>
</html>
