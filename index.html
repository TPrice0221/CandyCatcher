<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Popz: Sweet Beats</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: radial-gradient(circle, #ff007f, #330033); border: 4px solid #fff; border-radius: 10px; cursor: none; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); }
        #ui { position: absolute; top: 20px; text-align: center; pointer-events: none; width: 100%; }
        .stats { font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
        #message { position: absolute; top: 50%; transform: translateY(-50%); font-size: 48px; text-align: center; display: none; background: rgba(0,0,0,0.8); padding: 20px; width: 100%; }
        .controls { margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00ffcc; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stats">Score: <span id="score">0</span> | Streak: <span id="streak">0</span>%</div>
        <div class="controls">
            <button onclick="toggleHardMode()" id="modeBtn">Mode: Normal</button>
        </div>
    </div>

    <div id="message"></div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const msgEl = document.getElementById('message');

    canvas.width = 400;
    canvas.height = 600;

    // Game Variables
    let score = 0;
    let candiesCaught = 0;
    let totalSpawned = 0;
    let gameActive = true;
    let isHardMode = false;
    let bowl = { x: 160, y: 530, w: 80, h: 40 };
    let candies = [];
    
    // Config
    const types = ['🍬', '🍭', '🍩', '🍫'];
    const rottenType = '🤢';

    function toggleHardMode() {
        isHardMode = !isHardMode;
        document.getElementById('modeBtn').innerText = isHardMode ? "Mode: HARD" : "Mode: Normal";
        resetGame();
    }

    // Mouse/Touch Control
    const moveBowl = (e) => {
        let rect = canvas.getBoundingClientRect();
        let root = document.documentElement;
        let mouseX = (e.clientX || e.touches[0].clientX) - rect.left - root.scrollLeft;
        bowl.x = mouseX - bowl.w / 2;
        // Boundaries
        if (bowl.x < 0) bowl.x = 0;
        if (bowl.x > canvas.width - bowl.w) bowl.x = canvas.width - bowl.w;
    };

    canvas.addEventListener('mousemove', moveBowl);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveBowl(e); }, {passive: false});

    function spawnCandy() {
        if (!gameActive) return;
        
        let isRotten = Math.random() < (isHardMode ? 0.3 : 0.15);
        let candy = {
            x: Math.random() * (canvas.width - 30),
            y: -50,
            symbol: isRotten ? rottenType : types[Math.floor(Math.random() * types.length)],
            type: isRotten ? 'rotten' : 'good',
            speed: (isHardMode ? 5 : 3) + Math.random() * 2
        };
        
        if (candy.type === 'good') totalSpawned++;
        candies.push(candy);
        
        // Speed up spawning as game progresses
        setTimeout(spawnCandy, isHardMode ? 600 : 1000);
    }

    function update() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Bowl
        ctx.fillStyle = isHardMode ? '#ff0000' : '#00ffcc';
        ctx.fillRect(bowl.x, bowl.y, bowl.w, bowl.h);
        ctx.fillStyle = 'white';
        ctx.font = '16px Arial';
        ctx.fillText("POPS BOWL", bowl.x + 5, bowl.y + 25);

        candies.forEach((c, i) => {
            c.y += c.speed;
            ctx.font = '30px Arial';
            ctx.fillText(c.symbol, c.x, c.y);

            // Collision
            if (c.y + 20 > bowl.y && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === 'rotten') {
                    score = 0; // Knockout!
                    candiesCaught = 0;
                    flashScreen();
                } else {
                    score += 10;
                    candiesCaught++;
                }
                candies.splice(i, 1);
            }

            // Missed Candy
            if (c.y > canvas.height) {
                if (c.type === 'good') {
                    endGame(false); // Lost the perfect run
                }
                candies.splice(i, 1);
            }
        });

        // Update UI
        scoreEl.innerText = score;
        let streak = totalSpawned > 0 ? Math.round((candiesCaught / totalSpawned) * 100) : 100;
        streakEl.innerText = streak;

        requestAnimationFrame(update);
    }

    function flashScreen() {
        canvas.style.backgroundColor = 'red';
        setTimeout(() => { canvas.style.backgroundColor = ''; }, 100);
    }

    function endGame(win) {
        gameActive = false;
        msgEl.style.display = 'block';
        msgEl.innerHTML = win ? 
            "YOU WON! <br><small>Redeem: SUGARPOPZ100</small>" : 
            "MISSED A BEAT! <br><button onclick='resetGame()'>Try Again</button>";
    }

    function resetGame() {
        score = 0;
        candiesCaught = 0;
        totalSpawned = 0;
        candies = [];
        gameActive = true;
        msgEl.style.display = 'none';
        update();
    }

    spawnCandy();
    update();

</script>
</body>
</html>
