<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
    --mint: #00ffcc;
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: 'Arial Rounded MT Bold', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game-container {
    position: relative;
    width: 100%;
    max-width: 900px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    border: 10px solid white;
    border-radius: 40px;
}

#game-ui {
    position: absolute;
    top: -50px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
}

.stat-box {
    background: white;
    border: 4px solid var(--candy-pink);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 16px;
    color: #d63384;
    font-weight: bold;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,105,180,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    z-index: 100;
    border-radius: 30px;
    text-align: center;
}

.modal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 40px;
    border-radius: 40px;
    border: 10px solid var(--candy-pink);
    z-index: 200;
}

button {
    margin-top: 20px;
    padding: 15px 30px;
    border: none;
    background: var(--mint);
    border-radius: 50px;
    font-size: 18px;
}

@media (max-width:600px){
    .stat-box { font-size: 12px; padding: 5px 10px; }
}
</style>
</head>

<body>

<div id="game-container">

<div id="start-screen" class="overlay">
    <h1>SUGAR POPZ</h1>
    <button onclick="startGame()">START</button>
</div>

<div id="game-ui">
    <div class="stat-box">⭐ <span id="score">0</span></div>
    <div class="stat-box">LVL <span id="level">1</span></div>
    <div class="stat-box">🥣 <span id="candyCount">0</span></div>
</div>

<div id="game-over" class="modal">
    <h2>Game Over</h2>
    <button onclick="location.reload()">Retry</button>
</div>

<canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const BASE_WIDTH = 900;
const BASE_HEIGHT = 700;
let scale = 1;

function resizeCanvas(){
    const w = window.innerWidth * 0.95;
    const h = window.innerHeight * 0.8;
    scale = Math.min(w/BASE_WIDTH, h/BASE_HEIGHT);

    canvas.style.width = BASE_WIDTH * scale + "px";
    canvas.style.height = BASE_HEIGHT * scale + "px";

    canvas.width = BASE_WIDTH;
    canvas.height = BASE_HEIGHT;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let gameActive=false;
let bowl={x:400,y:620,w:160,h:60};
let candies=[];
let collected=[];
let particles=[];
let score=0;
let level=1;

const candyTypes=['🍬','🍭','🍩','🍫','🧁','🍦'];
const rottenTypes=['☠️','💀','🧪'];

// sprinkles
for(let i=0;i<60;i++){
    particles.push({
        x:Math.random()*BASE_WIDTH,
        y:Math.random()*BASE_HEIGHT,
        size:Math.random()*4+2,
        speed:Math.random()*2+1
    });
}

function spawnCandy(){
    if(!gameActive) return;

    let bad=Math.random()<0.2;

    candies.push({
        x:Math.random()*(BASE_WIDTH-50),
        y:-30,
        icon: bad ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)] :
                    candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: bad?"bad":"good",
        speed:3+level,
        size: bad?45:30
    });

    setTimeout(spawnCandy, Math.max(300,800-level*50));
}

function startGame(){
    document.getElementById("start-screen").style.display="none";
    gameActive=true;
    spawnCandy();
    draw();
}

function draw(){
    ctx.clearRect(0,0,BASE_WIDTH,BASE_HEIGHT);

    // particles
    particles.forEach(p=>{
        ctx.fillStyle="#fff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y+=p.speed;
        if(p.y>BASE_HEIGHT) p.y=0;
    });

    if(gameActive){
        ctx.fillStyle="white";
        ctx.fillRect(bowl.x,bowl.y,bowl.w,bowl.h);

        collected.forEach((c,i)=>{
            ctx.font="16px Arial";
            ctx.fillText(c, bowl.x+(i%6)*18, bowl.y+(i/6|0)*16);
        });

        for(let i=candies.length-1;i>=0;i--){
            let c=candies[i];
            c.y+=c.speed;

            ctx.font=c.size+"px Arial";
            ctx.fillText(c.icon,c.x,c.y);

            if(c.y>bowl.y && c.x>bowl.x && c.x<bowl.x+bowl.w){
                if(c.type==="bad"){
                    collected=[];
                    score=Math.floor(score/2);
                } else {
                    collected.push(c.icon);
                    score+=20;
                }
                candies.splice(i,1);
            }

            if(c.y>BASE_HEIGHT){
                if(c.type==="good"){
                    gameActive=false;
                    document.getElementById("game-over").style.display="block";
                }
                candies.splice(i,1);
            }
        }
    }

    document.getElementById("score").innerText=score;
    document.getElementById("candyCount").innerText=collected.length;
    document.getElementById("level").innerText=level;

    requestAnimationFrame(draw);
}

// controls
function updateBowl(clientX){
    let rect=canvas.getBoundingClientRect();
    let x=(clientX-rect.left)/scale;
    bowl.x=Math.max(0,Math.min(BASE_WIDTH-bowl.w,x-bowl.w/2));
}

canvas.addEventListener("mousemove",e=>updateBowl(e.clientX));
canvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    updateBowl(e.touches[0].clientX);
},{passive:false});
</script>

</body>
</html>
