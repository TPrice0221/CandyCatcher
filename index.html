<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
    --sugar-white: #fff5f8;
    --mint: #00ffcc;
    --bad-red: #ff3333;
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game-container {
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

canvas {
    display: block;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    border: 10px solid white;
    border-radius: 40px;
    cursor: crosshair;
}

#game-ui {
    position: absolute;
    top: -60px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.stat-box {
    background: white;
    border: 4px solid var(--candy-pink);
    padding: 8px 25px;
    border-radius: 50px;
    color: #d63384;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 4px 0 var(--candy-pink);
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,105,180,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 100;
    border-radius: 30px;
    text-align: center;
}

.modal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 40px;
    border-radius: 40px;
    border: 10px solid var(--candy-pink);
    text-align: center;
    z-index: 200;
    box-shadow: 0 20px 0 #d63384;
    min-width: 300px;
}

h1 { font-size: 60px; text-shadow: 4px 4px #d63384; margin: 0; }
h2 { color: #d63384; font-size: 32px; margin-top: 0; }

button {
    margin-top: 20px;
    padding: 20px 40px;
    border: none;
    background: var(--mint);
    color: #4a0026;
    font-size: 24px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #00ccaa;
}

button:active { transform: translateY(4px); box-shadow: 0 2px 0 #00ccaa; }

/* Visual Feedback Elements - Updated for Glow and Text-Only */
.feedback-text {
    position: absolute;
    pointer-events: none;
    font-weight: 900;
    font-size: 32px;
    z-index: 1000;
    text-align: center;
    width: 250px; /* Give text room to wrap if needed */
}

/* Green Glow for Good Candy */
.good-feedback {
    color: var(--mint);
    text-shadow: 
        0 0 10px rgba(0, 255, 204, 0.7),
        0 0 20px rgba(0, 255, 204, 0.5),
        2px 2px 2px #d63384; /* Keep a hint of pink shadow for depth */
    animation: goodFloat 0.8s ease-out forwards;
}

/* Red Glow for Bad Hits */
.bad-feedback {
    color: var(--bad-red);
    text-shadow: 
        0 0 10px rgba(255, 51, 51, 0.7),
        0 0 20px rgba(255, 51, 51, 0.5),
        2px 2px 2px #fff;
    animation: badFloat 1s ease-out forwards;
}

@keyframes goodFloat {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
}

@keyframes badFloat {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
}
</style>
</head>

<body>

<div id="game-container">
    <div id="start-screen" class="overlay">
        <h1>Sugar Popz' Candy Catcher 🍬</h1>
        <p style="font-size: 20px;">Fill the bowl to clear the level!</p>
        <button onclick="startGame()">START RACE</button>
    </div>

    <div id="game-ui">
        <div class="stat-box">⭐ <span id="score">0</span></div>
        <div class="stat-box">LVL: <span id="level">1</span></div>
        <div class="stat-box">🥣 <span id="candyCount">0</span></div>
    </div>

    <div id="game-over" class="modal">
        <h2>GLITCHED!</h2>
        <p>A sweet hit the floor...</p>
        <button onclick="location.reload()">RE-RACE</button>
    </div>

    <div id="level-up" class="modal">
        <h2>SWEET VICTORY!</h2>
        <p>Prepare for a bigger Rush!</p>
        <button onclick="nextLevel()">NEXT ROUND</button>
    </div>

    <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 700;

// 1. STATE & CONSTANTS
let gameActive = false;
let bowl = { x: 400, y: 620, w: 160, h: 65 };
let candies = [];
let collected = [];
let particles = [];
let score = 0;
let level = 1;
let targetScore = 500;

const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
const rottenTypes = ['☠️','💀','🧪', '🍄', '💩'];

// Witty Phrases - Updated
const sweetPhrases = [
    "SWEET!",
    "Gonna get a cavity!",
    "All that candy before bed?",
    "SUGAR RUSH!",
    "Dentist's nightmare!",
    "Instant regret (but tasty)!",
    "Nom nom nom!",
    "Save some for later!"
];

const insultPhrases = [
    "LOSER!",
    "TOO SLOW!",
    "MOLDY!",
    "YUCK!",
    "GLITCH!",
    "RUDE!",
    "Epic fail!",
    "Try harder!"
];

// Rotten Message Map
const rottenMessages = {
    '🧪': "CANDY BOWL POISONED!",
    '☠️': "BOWL STOLEN BY THE UNDEAD!",
    '💀': "SPOOKY SPIRITS EMPTIED THE BOWL!",
    '🍄': "TRIPPY TRAP! BOWL RESET!",
    '💩': "EWW! BOWL CONTAMINATED!"
};

// 2. AUDIO SETUP
let currentBeatIndex = 0;
const beats = ["beat1.mp3", "beat2.mp3", "beat3.mp3"];
const bpm = [140, 150, 160]; 
const audio = new Audio();
audio.loop = true;

let audioCtx;
function playTick(freq, dur) {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

function playBeat(index) {
    audio.src = beats[index % beats.length];
    audio.volume = 0.8;
    audio.play().catch(e => console.log("Audio waiting for interaction"));
}

// 3. VISUAL FEEDBACK HELPERS - Updated for new style
function showFeedback(text, x, y, type) {
    const el = document.createElement('div');
    el.className = `feedback-text ${type}-feedback`;
    el.innerText = text;
    // Center the wider text element over the drop point
    el.style.left = (x + canvas.offsetLeft - 125) + 'px';
    el.style.top = (y + canvas.offsetTop - 50) + 'px';
    document.body.appendChild(el);
    
    // Animation duration depends on type
    const duration = type === 'good' ? 800 : 1000;
    setTimeout(() => el.remove(), duration);
}

// 4. GAME LOGIC
function spawnCandy() {
    if (!gameActive) return;

    let isRotten = Math.random() < (0.12 + level * 0.03);
    candies.push({
        x: Math.random() * (canvas.width - 100) + 50,
        y: -50,
        icon: isRotten ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isRotten ? "bad" : "good",
        speed: 2 + level + (Math.random() * 1.5),
        size: isRotten ? 55 : 35 + Math.random() * 15
    });

    let currentBPM = bpm[currentBeatIndex % bpm.length];
    let nextSpawn = (60 / currentBPM) * 1000; 
    setTimeout(spawnCandy, nextSpawn);
}

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameActive = true;
    currentBeatIndex = 0;
    playBeat(currentBeatIndex);
    spawnCandy();
    requestAnimationFrame(draw);
}

function nextLevel() {
    document.getElementById("level-up").style.display = "none";
    level++;
    targetScore += 500;
    candies = [];
    collected = [];
    gameActive = true;
    
    currentBeatIndex++;
    playBeat(currentBeatIndex);
    spawnCandy();
}

// 5. RENDERING ENGINE
for (let i = 0; i < 70; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 2,
        speed: Math.random() * 1 + 0.5,
        color: ['#fff', '#ff99cc', '#00ffcc', '#ffff99'][Math.floor(Math.random()*4)]
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });

    if (gameActive) {
        // Bowl
        ctx.save();
        ctx.fillStyle = "white";
        ctx.strokeStyle = "var(--candy-pink)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 40, 40]);
        ctx.fill();
        ctx.stroke();

        collected.slice(-24).forEach((c,i)=>{
            ctx.font = "24px Arial";
            let row = Math.floor(i / 6);
            let col = i % 6;
            ctx.fillText(c, bowl.x + 15 + (col * 22), bowl.y + 15 + (row * 15));
        });
        ctx.restore();

        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            ctx.font = c.size + "px Arial";
            ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            // Collision Logic - Updated for new visual style
            if (c.y > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    collected = [];
                    score = Math.max(0, score - 150);
                    
                    // Show custom rotten visual and text roast (red glow)
                    const roastMsg = insultPhrases[Math.floor(Math.random()*insultPhrases.length)];
                    const rottenMsg = rottenMessages[c.icon] || "BOWL EMPTIED!";
                    const fullMsg = `${rottenMsg}\n${roastMsg}`; // Stack messages
                    
                    showFeedback(fullMsg, c.x, c.y, 'bad');
                    
                    playTick(40, 0.4);
                } else {
                    collected.push(c.icon);
                    score += 25;
                    
                    // Show random witty sweet phrase (green glow)
                    const phrase = sweetPhrases[Math.floor(Math.random()*sweetPhrases.length)];
                    showFeedback(phrase, c.x, bowl.y, 'good');
                    
                    playTick(300 + (level*40), 0.05);
                }
                candies.splice(i, 1);
                continue;
            }

            if (c.y > canvas.height) {
                if (c.type === "good") {
                    gameActive = false;
                    audio.pause();
                    document.getElementById("game-over").style.display = "block";
                }
                candies.splice(i, 1);
            }
        }

        if (score >= targetScore) {
            gameActive = false;
            document.getElementById("level-up").style.display = "block";
        }
    }

    document.getElementById("score").innerText = score;
    document.getElementById("candyCount").innerText = collected.length;
    document.getElementById("level").innerText = level;

    requestAnimationFrame(draw);
}

const updateBowlPos = (clientX) => {
    let rect = canvas.getBoundingClientRect();
    let targetX = clientX - rect.left - bowl.w/2;
    bowl.x = Math.max(0, Math.min(canvas.width - bowl.w, targetX));
};

canvas.addEventListener("mousemove", e => updateBowlPos(e.clientX));
canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    updateBowlPos(e.touches[0].clientX);
}, {passive:false});
</script>
</body>
</html>
