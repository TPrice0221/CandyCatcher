<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
    --sugar-white: #fff5f8;
    --mint: #00ffcc;
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game-container {
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

canvas {
    display: block;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    border: 10px solid white;
    border-radius: 40px;
    cursor: crosshair;
}

#game-ui {
    position: absolute;
    top: -60px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.stat-box {
    background: white;
    border: 4px solid var(--candy-pink);
    padding: 8px 25px;
    border-radius: 50px;
    color: #d63384;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 4px 0 var(--candy-pink);
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,105,180,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 100;
    border-radius: 30px;
    text-align: center;
}

.modal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 40px;
    border-radius: 40px;
    border: 10px solid var(--candy-pink);
    text-align: center;
    z-index: 200;
    box-shadow: 0 20px 0 #d63384;
    min-width: 300px;
}

h1 { font-size: 60px; text-shadow: 4px 4px #d63384; margin: 0; }
h2 { color: #d63384; font-size: 32px; margin-top: 0; }

button {
    margin-top: 20px;
    padding: 20px 40px;
    border: none;
    background: var(--mint);
    color: #4a0026;
    font-size: 24px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #00ccaa;
}

button:active { transform: translateY(4px); box-shadow: 0 2px 0 #00ccaa; }

.trash-talk {
    position: absolute;
    pointer-events: none;
    font-weight: bold;
    color: #ff0000;
    text-shadow: 2px 2px white;
    font-size: 24px;
    z-index: 1000;
    animation: floatUp 1s forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100px); opacity: 0; }
}
</style>
</head>

<body>

<div id="game-container">
    <div id="start-screen" class="overlay">
        <h1>Candy Catcher</h1>
        <p style="font-size: 20px;">Fill the bowl to clear the level!</p>
        <button onclick="startGame()">START RACE</button>
    </div>

    <div id="game-ui">
        <div class="stat-box">⭐ <span id="score">0</span></div>
        <div class="stat-box">LVL: <span id="level">1</span></div>
        <div class="stat-box">🥣 <span id="candyCount">0</span></div>
    </div>

    <div id="game-over" class="modal">
        <h2>GLITCHED!</h2>
        <p>A sweet hit the floor...</p>
        <button onclick="location.reload()">RE-RACE</button>
    </div>

    <div id="level-up" class="modal">
        <h2>SWEET VICTORY!</h2>
        <p>Prepare for a bigger Rush!</p>
        <button onclick="nextLevel()">NEXT ROUND</button>
    </div>

    <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 700;

let gameActive = false;
let bowl = { x: 400, y: 620, w: 160, h: 65 };
let candies = [];
let collected = [];
let particles = [];
let score = 0;
let level = 1;
let targetScore = 500;
    let bpm = [140, 150, 160]; // match your beats
let currentBPM = bpm[currentBeatIndex];

let nextSpawn = (60 / currentBPM) * 1000;

const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
const rottenTypes = ['☠️','💀','🧪', '🍄', '💩'];
const insults = ["LOSER!", "TOO SLOW!", "MOLDY!", "YUCK!", "GLITCH!", "RUDE!"];

// 🎹 AUDIO ENGINE
// 🎧 REAL AUDIO SYSTEM
let audio = new Audio();
let currentBeatIndex = 0;

const beats = [
    "beat1.mp3",
    "beat2.mp3",
    "beat3.mp3"
];

function playBeat(index) {
    audio.pause();
    audio = new Audio(beats[index]);
    audio.loop = true;
    audio.volume = 0.8;
    audio.play();
}

// SPRINKLE BACKDROP
for (let i = 0; i < 70; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 2,
        speed: Math.random() * 2 + 1,
        color: ['#fff', '#ff99cc', '#00ffcc', '#ffff99'][Math.floor(Math.random()*4)]
    });
}

function spawnCandy() {
    if (!gameActive) return; // Stop spawning if game is paused/level over

    let isRotten = Math.random() < (0.12 + level * 0.03);
    candies.push({
        x: Math.random() * (canvas.width - 100) + 50,
        y: -50,
        icon: isRotten 
            ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)]
            : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isRotten ? "bad" : "good",
        speed: 2 + level + (Math.random() * 1.5),
        size: isRotten ? 55 : 35 + Math.random() * 15
    });

    // Recursively call spawnCandy based on level speed
    let nextSpawn = Math.max(200, 1000 - level * 100);
    setTimeout(spawnCandy, nextSpawn);
}

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameActive = true;
    spawnCandy(); // Trigger the spawn loop
    requestAnimationFrame(draw);
    playBeat(currentBeatIndex);
    
    // Background beat loop
    setInterval(() => { 
        if(gameActive) playTick(80 + (level * 10), 0.1); 
    }, 500);
}

function nextLevel() {
    document.getElementById("level-up").style.display = "none";
    level++;
    targetScore += 500;
    candies = []; // Clear current falling ones
    collected = []; // Clear bowl visuals
    gameActive = true;
    currentBeatIndex++;
if (currentBeatIndex >= beats.length) {
    currentBeatIndex = 0; // loop beats if you run out
}

playBeat(currentBeatIndex);
    spawnCandy(); // RE-START the spawn loop for the new level
}

function showTrashTalk(text, x, y) {
    const el = document.createElement('div');
    el.className = 'trash-talk';
    el.innerText = text;
    el.style.left = (x + canvas.offsetLeft - 50) + 'px';
    el.style.top = (y + canvas.offsetTop) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Background Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });

    if (gameActive) {
        // Bowl
        ctx.save();
        ctx.fillStyle = "white";
        ctx.strokeStyle = "var(--candy-pink)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 40, 40]);
        ctx.fill();
        ctx.stroke();

        // Candy in Bowl Visual
        collected.slice(-24).forEach((c,i)=>{
            ctx.font = "24px Arial";
            let row = Math.floor(i / 6);
            let col = i % 6;
            ctx.fillText(c, bowl.x + 15 + (col * 22), bowl.y + 15 + (row * 15));
        });
        ctx.restore();

        // Falling items
        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            
            ctx.font = c.size + "px Arial";
            ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            // Catch check
            if (c.y > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    collected = [];
                    score = Math.max(0, score - 150);
                    showTrashTalk(insults[Math.floor(Math.random()*insults.length)], c.x, c.y);
                    playTick(40, 0.4);
                } else {
                    collected.push(c.icon);
                    score += 25;
                    playTick(300 + (level*40), 0.05);
                }
                candies.splice(i, 1);
                continue;
            }

            // Miss check
            if (c.y > canvas.height) {
                if (c.type === "good") {
                    gameActive = false;
                    document.getElementById("game-over").style.display = "block";
                }
                candies.splice(i, 1);
            }
        }

        // Win check
        if (score >= targetScore) {
            gameActive = false;
            document.getElementById("level-up").style.display = "block";
        }
    }

    document.getElementById("score").innerText = score;
    document.getElementById("candyCount").innerText = collected.length;
    document.getElementById("level").innerText = level;

    requestAnimationFrame(draw);
}

// Smooth Controls
const updateBowlPos = (clientX) => {
    let rect = canvas.getBoundingClientRect();
    let targetX = clientX - rect.left - bowl.w/2;
    bowl.x = Math.max(0, Math.min(canvas.width - bowl.w, targetX));
};

canvas.addEventListener("mousemove", e => updateBowlPos(e.clientX));
canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    updateBowlPos(e.touches[0].clientX);
}, {passive:false});

</script>
</body>
</html>
