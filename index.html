<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
    --mint: #00ffcc;
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game-container {
    position: relative;
    /* The Sweet Spot Size */
    width: 600px; 
    max-width: 95vw;
    height: 800px;
    max-height: 85vh;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    border: 8px solid white;
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    cursor: none;
}

#game-ui {
    position: absolute;
    top: -55px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.stat-box {
    background: white;
    border: 3px solid var(--candy-pink);
    padding: 6px 18px;
    border-radius: 50px;
    color: #d63384;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 4px 0 var(--candy-pink);
}

.overlay, .modal {
    position: absolute;
    inset: 0;
    background: rgba(255,105,180,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 100;
    border-radius: 22px;
    text-align: center;
    padding: 20px;
}

.modal {
    display: none;
    background: white;
    inset: 15% 10%;
    height: auto;
    border: 8px solid var(--candy-pink);
    color: #d63384;
    box-shadow: 0 15px 0 #d63384;
}

button {
    padding: 15px 30px;
    border: none;
    background: var(--mint);
    color: #4a0026;
    font-size: 22px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 0 #00ccaa;
}

button:active { transform: translateY(4px); box-shadow: 0 2px 0 #00ccaa; }

.trash-talk {
    position: absolute;
    pointer-events: none;
    font-weight: bold;
    color: #ff0000;
    text-shadow: 2px 2px white;
    font-size: 24px;
    animation: floatUp 0.8s forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-80px); opacity: 0; }
}
</style>
</head>

<body>

<div id="game-container">
    <div id="start-screen" class="overlay">
        <h1>SUGAR POPZ</h1>
        <p>Catch the sweets!</p>
        <button onclick="startGame()">START RACE</button>
    </div>

    <div id="game-ui">
        <div class="stat-box">⭐ <span id="score">0</span></div>
        <div class="stat-box">LVL: <span id="level">1</span></div>
        <div class="stat-box">🥣 <span id="candyCount">0</span></div>
    </div>

    <div id="game-over" class="modal">
        <h2>GLITCHED!</h2>
        <p>A sweet treat hit the street!</p>
        <button onclick="location.reload()">RE-RACE</button>
    </div>

    <div id="level-up" class="modal">
        <h2>SWEET!</h2>
        <button onclick="nextLevel()">NEXT ROUND</button>
    </div>

    <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Internal resolution for crispness
canvas.width = 800;
canvas.height = 1000;

let gameActive = false;
let bowl = { x: 325, y: 880, w: 150, h: 65 };
let candies = [];
let collected = [];
let particles = [];
let score = 0;
let level = 1;
let targetScore = 500;

const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪'];
const rottenTypes = ['☠️','💀','🍄', '💩'];

// AUDIO
let audioCtx;
function playTick(freq, dur) {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

// BACKDROP SPRINKLES
for (let i = 0; i < 60; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 2,
        speed: Math.random() * 2 + 1,
        color: ['#fff', '#ff99cc', '#00ffcc'][Math.floor(Math.random()*3)]
    });
}

function spawnCandy() {
    if (!gameActive) return;
    let isRotten = Math.random() < (0.12 + level * 0.03);
    candies.push({
        x: Math.random() * (canvas.width - 100) + 50,
        y: -50,
        icon: isRotten ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isRotten ? "bad" : "good",
        speed: 4 + level + (Math.random() * 2),
        size: isRotten ? 60 : 40 + Math.random() * 15
    });
    setTimeout(spawnCandy, Math.max(250, 900 - level * 80));
}

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameActive = true;
    spawnCandy();
    draw();
    setInterval(() => { if(gameActive) playTick(100 + (level * 10), 0.1); }, 600);
}

function nextLevel() {
    document.getElementById("level-up").style.display = "none";
    level++;
    targetScore += 500;
    candies = [];
    collected = [];
    gameActive = true;
    spawnCandy();
}

function showTrashTalk(text, x, y) {
    const el = document.createElement('div');
    el.className = 'trash-talk';
    el.innerText = text;
    const rect = canvas.getBoundingClientRect();
    el.style.left = (x / canvas.width * rect.width + rect.left) + 'px';
    el.style.top = (y / canvas.height * rect.height + rect.top) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });

    if (gameActive) {
        // Bowl
        ctx.save();
        ctx.fillStyle = "white";
        ctx.strokeStyle = "var(--candy-pink)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 40, 40]);
        ctx.fill();
        ctx.stroke();

        // Candy pile
        collected.slice(-18).forEach((c,i)=>{
            ctx.font = "24px Arial";
            ctx.fillText(c, bowl.x + 15 + (i%6 * 22), bowl.y + 20 + (Math.floor(i/6) * 15));
        });
        ctx.restore();

        // Items
        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            ctx.font = c.size + "px Arial";
            ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            if (c.y > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    collected = [];
                    score = Math.max(0, score - 100);
                    showTrashTalk("YUCK!", c.x, c.y);
                    playTick(60, 0.3);
                } else {
                    collected.push(c.icon);
                    score += 25;
                    playTick(350, 0.05);
                }
                candies.splice(i, 1);
                continue;
            }

            if (c.y > canvas.height) {
                if (c.type === "good") {
                    gameActive = false;
                    document.getElementById("game-over").style.display = "block";
                }
                candies.splice(i, 1);
            }
        }

        if (score >= targetScore) {
            gameActive = false;
            document.getElementById("level-up").style.display = "block";
        }
    }

    document.getElementById("score").innerText = score;
    document.getElementById("candyCount").innerText = collected.length;
    document.getElementById("level").innerText = level;

    requestAnimationFrame(draw);
}

// SMOOTH INPUT (Anywhere on window)
const handleInput = (clientX) => {
    let rect = canvas.getBoundingClientRect();
    let targetX = (clientX - rect.left) * (canvas.width / rect.width) - bowl.w/2;
    bowl.x = Math.max(0, Math.min(canvas.width - bowl.w, targetX));
};

window.addEventListener("mousemove", e => handleInput(e.clientX));
window.addEventListener("touchmove", e => {
    handleInput(e.touches[0].clientX);
}, {passive:false});

</script>
</body>
</html>
