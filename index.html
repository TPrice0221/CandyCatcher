<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Popz: Sugar Rush Edition</title>

<style>
:root { 
    --candy-pink: #ff69b4; 
}

body {
    margin: 0;
    background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

canvas {
    display: block;
    margin: auto;
    background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
    border: 8px solid white;
    border-radius: 30px;
}

#game-ui {
    position: absolute;
    top: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.stat-box {
    background: white;
    border: 4px solid var(--candy-pink);
    padding: 10px 20px;
    border-radius: 50px;
}

.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(255,105,180,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.modal {
    display: none;
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 30px;
    border: 8px solid var(--candy-pink);
}

button {
    margin-top: 20px;
    padding: 15px 30px;
    border: none;
    background: #00ffcc;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="start-screen" class="overlay">
    <h1>SUGAR POPZ</h1>
    <button onclick="startGame()">START</button>
</div>

<div id="game-ui">
    <div class="stat-box">LVL: <span id="level">1</span></div>
    <div class="stat-box">SCORE: <span id="score">0</span></div>
    <div class="stat-box">CANDY: <span id="candyCount">0</span></div>
</div>

<div id="game-over" class="modal">
    <h2>Game Over</h2>
    <button onclick="location.reload()">Retry</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

let gameActive = false;
let animationRunning = false;

let bowl = { x: 350, y: 520, w: 120, h: 60 };
let candies = [];
let collected = [];
let particles = [];
let score = 0;
let level = 1;

const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦'];
const rottenTypes = ['☠️','💀','🧪'];


// 🍬 SPRINKLES
for (let i = 0; i < 50; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 4 + 2,
        speed: Math.random() * 2 + 1
    });
}


// 🍬 SPAWN
function spawnCandy() {
    if (!gameActive) return;

    let isRotten = Math.random() < (0.15 + level * 0.03);

    candies.push({
        x: Math.random() * (canvas.width - 50),
        y: -30,
        icon: isRotten 
            ? rottenTypes[Math.floor(Math.random()*rottenTypes.length)]
            : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isRotten ? "bad" : "good",
        speed: 3 + level,
        size: isRotten ? 40 : 30
    });

    setTimeout(spawnCandy, Math.max(300, 800 - level * 60));
}


// 🎮 START
function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameActive = true;

    if (!animationRunning) {
        animationRunning = true;
        draw();
    }

    spawnCandy();
}


// 🖌 DRAW LOOP
function draw() {
    if (!animationRunning) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // SPRINKLES
    particles.forEach(p => {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });

    if (gameActive) {

        // BOWL
        ctx.fillStyle = "white";
        ctx.fillRect(bowl.x, bowl.y, bowl.w, bowl.h);

        // BOWL CANDY
        collected.forEach((c,i)=>{
            ctx.font = "16px Arial";
            ctx.fillText(c, bowl.x + (i%6)*18, bowl.y + (i/6|0)*16);
        });

        // CANDIES
        candies.forEach((c,i)=>{
            c.y += c.speed;
            ctx.font = c.size + "px Arial";
            ctx.fillText(c.icon, c.x, c.y);

            // collision
            if (c.y > bowl.y && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    collected = [];
                    score = Math.floor(score / 2);
                } else {
                    collected.push(c.icon);
                    score += 20;
                }
                candies.splice(i,1);
            }

            // miss
            if (c.y > canvas.height) {
                if (c.type === "good") {
                    gameActive = false;
                    document.getElementById("game-over").style.display = "block";
                }
                candies.splice(i,1);
            }
        });
    }

    document.getElementById("score").innerText = score;
    document.getElementById("candyCount").innerText = collected.length;

    requestAnimationFrame(draw);
}


// 🎮 CONTROLS
canvas.addEventListener("mousemove", e=>{
    let rect = canvas.getBoundingClientRect();
    bowl.x = e.clientX - rect.left - bowl.w/2;
});

canvas.addEventListener("touchmove", e=>{
    e.preventDefault();
    let rect = canvas.getBoundingClientRect();
    bowl.x = e.touches[0].clientX - rect.left - bowl.w/2;
},{passive:false});

</script>
</body>
</html>
