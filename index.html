<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Popz: Sugar Rush Edition</title>
    <style>
        :root { 
            --candy-pink: #ff69b4; 
            --mint: #00ffcc;
            --bad-red: #ff3333;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 760px; /* Extra height for UI */
        }

        #game-ui {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .stat-box {
            background: white;
            border: 4px solid var(--candy-pink);
            padding: 5px 20px;
            border-radius: 50px;
            color: #d63384;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 0 var(--candy-pink);
        }

        #canvas-wrapper {
            position: relative;
            width: 900px;
            height: 700px;
            background: #000;
            border: 10px solid white;
            border-radius: 40px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        #feedback-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 105, 180, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            text-align: center;
        }

        .modal {
            background: white;
            border: 10px solid var(--candy-pink);
            color: #d63384;
            border-radius: 40px;
            box-shadow: 0 20px 0 #d63384;
            padding: 40px;
            z-index: 101;
        }

        h1 { font-size: 60px; margin: 0; text-shadow: 4px 4px #d63384; }
        
        button {
            margin-top: 20px;
            padding: 15px 40px;
            border: none;
            background: var(--mint);
            color: #4a0026;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #00ccaa;
        }

        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #00ccaa; }

        .feedback-text {
            position: absolute;
            font-weight: 900;
            font-size: 32px;
            text-align: center;
            width: 250px;
            pointer-events: none;
        }

        .good-feedback {
            color: var(--mint);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8), 2px 2px #d63384;
            animation: floatUp 0.8s forwards;
        }

        .bad-feedback {
            color: var(--bad-red);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8), 2px 2px #fff;
            animation: shake 0.5s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="game-ui">
        <div class="stat-box">⭐ <span id="score">0</span></div>
        <div class="stat-box">LEVEL <span id="level">1</span></div>
        <div class="stat-box">🥣 <span id="candyCount">0</span></div>
    </div>

    <div id="canvas-wrapper">
        <div id="screen-overlay" class="overlay">
            <h1>Sugar Popz!</h1>
            <p>Catch candy, avoid the rot.</p>
            <button onclick="bootGame()">START RACE</button>
        </div>
        <div id="feedback-layer"></div>
        <canvas id="game"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const feedbackLayer = document.getElementById("feedback-layer");
    const overlay = document.getElementById("screen-overlay");

    const GAME_W = 900;
    const GAME_H = 700;
    canvas.width = GAME_W;
    canvas.height = GAME_H;

    let gameActive = false;
    let score = 0;
    let level = 1;
    let target = 500;
    let bowl = { x: 370, y: 620, w: 160, h: 65 };
    let candies = [];
    let collected = [];

    const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
    const badTypes = ['☠️','💀','🧪', '🍄', '💩'];
    const phrases = ["SWEET!", "Cavity alert!", "Sugar Rush!", "Nom Nom!", "Dentist's nightmare!"];

    function bootGame() {
        // Physical removal ensures mouse interaction is never blocked
        overlay.style.display = "none";
        gameActive = true;
        score = 0;
        level = 1;
        candies = [];
        collected = [];
        spawn();
        requestAnimationFrame(loop);
    }

    function spawn() {
        if (!gameActive) return;
        let isBad = Math.random() < (0.1 + level * 0.02);
        candies.push({
            x: Math.random() * (GAME_W - 100) + 50,
            y: -50,
            icon: isBad ? badTypes[Math.floor(Math.random()*badTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
            type: isBad ? "bad" : "good",
            speed: 3 + level + (Math.random() * 2)
        });
        setTimeout(spawn, 1000 - (level * 50));
    }

    function pop(text, x, y, type) {
        const el = document.createElement('div');
        el.className = `feedback-text ${type}-feedback`;
        el.innerText = text;
        el.style.left = (x - 125) + 'px';
        el.style.top = (y - 50) + 'px';
        feedbackLayer.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function loop() {
        ctx.clearRect(0, 0, GAME_W, GAME_H);

        if (gameActive) {
            // Draw Bowl
            ctx.fillStyle = "white";
            ctx.strokeStyle = "var(--candy-pink)";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 30, 30]);
            ctx.fill();
            ctx.stroke();

            // Draw collected candy inside bowl
            collected.slice(-10).forEach((c, i) => {
                ctx.font = "24px Arial";
                ctx.fillText(c, bowl.x + 20 + (i * 12), bowl.y + 35);
            });

            // Handle falling items
            for (let i = candies.length - 1; i >= 0; i--) {
                let c = candies[i];
                c.y += c.speed;
                ctx.font = "45px Arial";
                ctx.textAlign = "center";
                ctx.fillText(c.icon, c.x, c.y);

                // Collision
                if (c.y > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                    if (c.type === "bad") {
                        pop("YUCK!", c.x, c.y, 'bad');
                        collected = [];
                        score = Math.max(0, score - 100);
                    } else {
                        collected.push(c.icon);
                        score += 25;
                        pop(phrases[Math.floor(Math.random()*phrases.length)], c.x, bowl.y, 'good');
                    }
                    candies.splice(i, 1);
                } else if (c.y > GAME_H) {
                    if (c.type === "good") {
                        gameActive = false;
                        overlay.innerHTML = `<div class="modal"><h2>GAME OVER</h2><p>Sweet hit the floor!</p><button onclick="location.reload()">RETRY</button></div>`;
                        overlay.style.display = "flex";
                    }
                    candies.splice(i, 1);
                }
            }

            if (score >= target) {
                gameActive = false;
                level++;
                target += 500;
                overlay.innerHTML = `<div class="modal"><h2>VICTORY!</h2><p>Level ${level} is faster!</p><button onclick="resume()">NEXT LEVEL</button></div>`;
                overlay.style.display = "flex";
            }
        }

        document.getElementById("score").innerText = score;
        document.getElementById("level").innerText = level;
        document.getElementById("candyCount").innerText = collected.length;
        requestAnimationFrame(loop);
    }

    function resume() {
        overlay.style.display = "none";
        gameActive = true;
        candies = [];
        spawn();
    }

    // Fixed Mouse Movement
    window.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleX = GAME_W / rect.width;
        let mouseX = (e.clientX - rect.left) * scaleX;
        bowl.x = Math.max(0, Math.min(GAME_W - bowl.w, mouseX - bowl.w / 2));
    });
</script>
</body>
</html>
