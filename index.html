<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sugar Popz: 20-Candy Challenge</title>
    <style>
        :root { 
            --candy-pink: #ff69b4; 
            --mint: #00ffcc;
            --bad-red: #ff3333;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-ui {
            width: 900px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            pointer-events: none;
            z-index: 50;
        }

        .stat-box {
            background: white;
            border: 4px solid var(--candy-pink);
            padding: 5px 15px;
            border-radius: 50px;
            color: #d63384;
            font-weight: bold;
            font-size: clamp(14px, 4vw, 18px);
            box-shadow: 0 4px 0 var(--candy-pink);
        }

        #canvas-wrapper {
            position: relative;
            width: 900px;
            height: 700px;
            max-width: 95vw;
            max-height: 70vh;
            background: #000;
            border: 8px solid white;
            border-radius: 30px;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none;
        }

        #feedback-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 105, 180, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: white;
            border: 8px solid var(--candy-pink);
            color: #d63384;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            width: 80%;
        }

        h1 { font-size: clamp(30px, 8vw, 60px); text-shadow: 4px 4px #d63384; margin: 0; color: white; }
        
        button {
            background: var(--mint);
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: bold;
            box-shadow: 0 5px 0 #00ccaa;
            cursor: pointer;
            color: #4a0026;
            margin-top: 15px;
        }

        .feedback-text {
            position: absolute;
            font-weight: 900;
            font-size: 28px;
            pointer-events: none;
            text-align: center;
            width: 250px;
            animation: floatUp 0.8s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="stat-box">⭐ <span id="score">0</span></div>
    <div class="stat-box">LVL <span id="level">1</span></div>
    <div class="stat-box">🥣 <span id="candyCount">0</span>/20</div>
</div>

<div id="canvas-wrapper">
    <div id="screen-overlay" class="overlay">
        <div class="modal-box" id="modal-content">
            <h1>Sugar Popz' Candy Catcher 🍬</h1>
            <p>Fill the bowl with 20 candies to advance!<br>Careful: Rotten candy resets your bowl.</p>
            <button onclick="bootGame()">START GAME</button>
        </div>
    </div>
    <div id="feedback-layer"></div>
    <canvas id="game"></canvas>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const feedbackLayer = document.getElementById("feedback-layer");
    const overlay = document.getElementById("screen-overlay");
    const modalContent = document.getElementById("modal-content");

    const GAME_W = 900;
    const GAME_H = 700;
    canvas.width = GAME_W;
    canvas.height = GAME_H;

    let gameActive = false;
    let score = 0, level = 1;
    let bowl = { x: 370, y: 600, w: 160, h: 65 };
    let candies = [];
    let collected = [];
    let particles = [];

    const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨','🍮','🍰'];
    const badTypes = ['☠️','💀','🧪', '🍄', '💩'];
    const sweetPhrases = ["SWEET!", "Cavity alert!", "Sugar Rush!", "Nom Nom!", "Gimme more!", "Sugar High!", "Tasty!", "Delicious!"];
    const rottenMessages = {'🧪': "POISONED!", '☠️': "STOLEN!", '💀': "CURSED!", '🍄': "TRAPPED!", '💩': "YUCK!"};

    // Sprinkles background setup
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * GAME_W,
            y: Math.random() * GAME_H,
            size: Math.random() * 4 + 1,
            speed: Math.random() * 1 + 0.5,
            color: ['#fff', '#ff99cc', '#00ffcc', '#ffff99'][Math.floor(Math.random()*4)]
        });
    }

    function bootGame() {
        overlay.style.display = "none";
        gameActive = true;
        score = 0; level = 1;
        candies = []; collected = [];
        spawn();
        requestAnimationFrame(loop);
    }

    function handleMove(e) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_W / rect.width;
        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const mouseX = (clientX - rect.left) * scaleX;
        bowl.x = mouseX - (bowl.w / 2);
        if (bowl.x < 0) bowl.x = 0;
        if (bowl.x > GAME_W - bowl.w) bowl.x = GAME_W - bowl.w;
    }

    canvas.addEventListener("mousemove", handleMove);
    canvas.addEventListener("touchmove", (e) => { handleMove(e); e.preventDefault(); }, { passive: false });

    // Faster spawning logic
function spawn() {
    if (!gameActive) return;
    
    let isBad = Math.random() < (0.12 + level * 0.03); // Slightly more rotten items per level
    candies.push({
        x: Math.random() * (GAME_W - 100) + 50,
        y: -50,
        icon: isBad ? badTypes[Math.floor(Math.random()*badTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
        type: isBad ? "bad" : "good",
        speed: 4 + level + (Math.random() * 2) // Base speed starts at 5 now, not 4
    });

    // Frequency logic: Level 1 starts at 700ms (was 1000ms)
    // Every level speeds up the spawn rate by 80ms
    let delay = Math.max(250, 700 - (level * 80)); 
    setTimeout(spawn, delay);
}

// Updated Level Up to ensure the speed scales correctly

    function pop(text, x, y, type) {
        const el = document.createElement('div');
        el.className = `feedback-text`;
        el.style.color = type === 'good' ? 'var(--mint)' : 'var(--bad-red)';
        el.style.textShadow = type === 'good' ? '0 0 10px #00ffcc, 2px 2px #d63384' : '0 0 10px #ff3333, 2px 2px #fff';
        el.innerText = text;
        el.style.left = (x - 125) + 'px';
        el.style.top = (y - 50) + 'px';
        feedbackLayer.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function loop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, GAME_W, GAME_H);

        // Background sprinkles
        particles.forEach(p => {
            ctx.fillStyle = p.color + '88';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            p.y += p.speed; if (p.y > GAME_H) p.y = 0;
        });

        // Bowl
        ctx.fillStyle = "white"; ctx.strokeStyle = "var(--candy-pink)"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 30, 30]); ctx.fill(); ctx.stroke();
        
        // Items inside bowl
        collected.forEach((c, i) => {
            ctx.font = "22px Arial";
            ctx.fillText(c, bowl.x + 15 + (i % 5 * 28), bowl.y + 25 + (Math.floor(i/5) * 18));
        });

        // Falling items
        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            ctx.font = "48px Arial"; ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            if (c.y + 20 > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    pop(rottenMessages[c.icon] || "YUCK!", c.x, c.y, 'bad');
                    collected = []; // Reset bowl counter
                } else {
                    collected.push(c.icon);
                    score += 25;
                    pop(sweetPhrases[Math.floor(Math.random()*sweetPhrases.length)], c.x, bowl.y, 'good');
                    
                    if (collected.length >= 20) {
                        levelUp();
                    }
                }
                candies.splice(i, 1);
            } else if (c.y > GAME_H + 50) {
                if (c.type === "good") gameOver();
                candies.splice(i, 1);
            }
        }

        document.getElementById("score").innerText = score;
        document.getElementById("level").innerText = level;
        document.getElementById("candyCount").innerText = collected.length;
        requestAnimationFrame(loop);
    }

    function levelUp() {
    gameActive = false;
    level++;
    collected = [];
    candies = [];
    modalContent.innerHTML = `
        <h1>LEVEL UP!</h1>
        <p>Sugar rush increasing!<br>Spawns are now **faster** for Level ${level}.</p>
        <button onclick="resume()">BRING IT ON</button>
    `;
    overlay.style.display = "flex";
}


    function resume() {
        overlay.style.display = "none";
        gameActive = true;
        spawn();
        requestAnimationFrame(loop);
    }

    function gameOver() {
        gameActive = false;
        modalContent.innerHTML = `<h1>GAME OVER</h1><p>A sweet escaped!</p><button onclick="location.reload()">TRY AGAIN</button>`;
        overlay.style.display = "flex";
    }
</script>
</body>
</html>
