<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sugar Popz: Mobile Edition</title>
    <style>
        :root { 
            --candy-pink: #ff69b4; 
            --mint: #00ffcc;
            --bad-red: #ff3333;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #ff99cc 0%, #ff66b2 100%);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden; /* Stops the whole page from scrolling */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Crucial for mobile: stops pull-to-refresh */
        }

        #game-ui {
            width: 900px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .stat-box {
            background: white;
            border: 4px solid var(--candy-pink);
            padding: 5px 15px;
            border-radius: 50px;
            color: #d63384;
            font-weight: bold;
            font-size: clamp(14px, 4vw, 18px);
            box-shadow: 0 4px 0 var(--candy-pink);
        }

        #canvas-wrapper {
            position: relative;
            width: 900px;
            height: 700px;
            max-width: 95vw; /* Scale down for smaller screens */
            max-height: 70vh;
            background: #000;
            border: 8px solid white;
            border-radius: 30px;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #ffe6f2 0%, #ffb3d9 100%);
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents browser interference during play */
            cursor: none;
        }

        #feedback-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 105, 180, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: white;
            border: 8px solid var(--candy-pink);
            color: #d63384;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            width: 80%;
        }

        button {
            background: var(--mint);
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #00ccaa;
            cursor: pointer;
        }

        .feedback-text {
            position: absolute;
            font-weight: 900;
            font-size: 28px;
            pointer-events: none;
            text-align: center;
            width: 200px;
            animation: floatUp 0.8s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="stat-box">⭐ <span id="score">0</span></div>
    <div class="stat-box">LVL <span id="level">1</span></div>
    <div class="stat-box">🥣 <span id="candyCount">0</span></div>
</div>

<div id="canvas-wrapper">
    <div id="screen-overlay" class="overlay">
        <div class="modal-box">
            <h1>Sugar Popz!</h1>
            <p>Drag the bowl to catch treats!</p>
            <button onclick="bootGame()">PLAY NOW</button>
        </div>
    </div>
    <div id="feedback-layer"></div>
    <canvas id="game"></canvas>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const feedbackLayer = document.getElementById("feedback-layer");
    const overlay = document.getElementById("screen-overlay");

    const GAME_W = 900;
    const GAME_H = 700;
    canvas.width = GAME_W;
    canvas.height = GAME_H;

    let gameActive = false;
    let score = 0, level = 1, target = 500;
    let bowl = { x: 370, y: 600, w: 160, h: 65 };
    let candies = [];
    let collected = [];

    const candyTypes = ['🍬','🍭','🍩','🍫','🧁','🍦','🍪','🥨'];
    const badTypes = ['☠️','💀','🧪', '🍄'];

    function bootGame() {
        overlay.style.display = "none";
        gameActive = true;
        score = 0; level = 1; target = 500;
        candies = []; collected = [];
        spawn();
        requestAnimationFrame(loop);
    }

    // UNIFIED INPUT: Handles Mouse and Touch seamlessly
    function handleMove(e) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_W / rect.width;
        
        // Use clientX from either Mouse event or Touch event
        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const mouseX = (clientX - rect.left) * scaleX;
        
        bowl.x = mouseX - (bowl.w / 2);
        if (bowl.x < 0) bowl.x = 0;
        if (bowl.x > GAME_W - bowl.w) bowl.x = GAME_W - bowl.w;
    }

    canvas.addEventListener("mousemove", handleMove);
    canvas.addEventListener("touchmove", (e) => {
        handleMove(e);
        e.preventDefault(); // Critical: stops the page from bouncing
    }, { passive: false });

    function spawn() {
        if (!gameActive) return;
        let isBad = Math.random() < (0.1 + level * 0.02);
        candies.push({
            x: Math.random() * (GAME_W - 100) + 50,
            y: -50,
            icon: isBad ? badTypes[Math.floor(Math.random()*badTypes.length)] : candyTypes[Math.floor(Math.random()*candyTypes.length)],
            type: isBad ? "bad" : "good",
            speed: 3 + level + (Math.random() * 2)
        });
        setTimeout(spawn, Math.max(300, 1000 - (level * 50)));
    }

    function pop(text, x, y, colorClass) {
        const el = document.createElement('div');
        el.className = `feedback-text`;
        el.style.color = colorClass === 'good' ? 'var(--mint)' : 'var(--bad-red)';
        el.innerText = text;
        el.style.left = (x - 100) + 'px';
        el.style.top = (y - 50) + 'px';
        feedbackLayer.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function loop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, GAME_W, GAME_H);

        // Bowl
        ctx.fillStyle = "white";
        ctx.strokeStyle = "var(--candy-pink)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.roundRect(bowl.x, bowl.y, bowl.w, bowl.h, [0, 0, 30, 30]);
        ctx.fill();
        ctx.stroke();

        // Items
        for (let i = candies.length - 1; i >= 0; i--) {
            let c = candies[i];
            c.y += c.speed;
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.fillText(c.icon, c.x, c.y);

            if (c.y + 20 > bowl.y && c.y < bowl.y + bowl.h && c.x > bowl.x && c.x < bowl.x + bowl.w) {
                if (c.type === "bad") {
                    pop("YUCK!", c.x, c.y, 'bad');
                    collected = [];
                    score = Math.max(0, score - 100);
                } else {
                    collected.push(c.icon);
                    score += 25;
                    pop("SWEET!", c.x, bowl.y, 'good');
                }
                candies.splice(i, 1);
            } else if (c.y > GAME_H + 50) {
                if (c.type === "good") endGame("A sweet hit the floor!");
                candies.splice(i, 1);
            }
        }

        if (score >= target) {
            gameActive = false;
            level++;
            target += 500;
            overlay.innerHTML = `<div class="modal-box"><h1>LEVEL UP!</h1><p>Ready for Level ${level}?</p><button onclick="resume()">GO!</button></div>`;
            overlay.style.display = "flex";
        }

        document.getElementById("score").innerText = score;
        document.getElementById("level").innerText = level;
        document.getElementById("candyCount").innerText = collected.length;
        requestAnimationFrame(loop);
    }

    function resume() { overlay.style.display = "none"; gameActive = true; spawn(); requestAnimationFrame(loop); }
    function endGame(m) { gameActive = false; overlay.innerHTML = `<div class="modal-box"><h1>GAME OVER</h1><p>${m}</p><button onclick="location.reload()">RETRY</button></div>`; overlay.style.display = "flex"; }
</script>
</body>
</html>
